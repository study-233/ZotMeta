name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*"

permissions:
  contents: write
  pull-requests: write

jobs:
  fork-release:
    if: github.repository == 'study-233/ZotMeta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Verify tag and build the tested fork package
      run: |
        version=$(node -p "require('./src/manifest.json').version")
        test "$GITHUB_REF_NAME" = "v$version"
        test -s "docs/releases/$GITHUB_REF_NAME.md"
        python -B scripts/build.py
        cd build
        sha256sum -c "zotmeta-$version.xpi.sha256"
    - name: Release fork package
      uses: softprops/action-gh-release@v2
      with:
        body_path: docs/releases/${{ github.ref_name }}.md
        fail_on_unmatched_files: true
        files: |
          build/*.xpi
          build/*.xpi.sha256

  build:
    if: github.repository != 'study-233/ZotMeta'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Update version info
      run: |
          tag=${GITHUB_REF#refs/tags/v}
          echo "RELEASE_VERSION=${tag}" >> "$GITHUB_ENV"
          echo "Generating release ${tag}..."
          sed -E -i "s#<em:version>[0-9.]+</em:version>#<em:version>${tag}</em:version>#" src/install.rdf
          sed -E -i "s#\"version\": \"[0-9.]+\"#\"version\": \"${tag}\"#" src/manifest.json

    - name: Make
      run: make clean && make
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZotMeta
        path: build/zotmeta*.xpi
    
    - name: Release add-on
      uses: softprops/action-gh-release@v2
      with:
        files: build/zotmeta*.xpi

    - name: Open updates.json PR
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: release/v${{ env.RELEASE_VERSION }}-updates
        base: master
        title: "Update ZotMeta release metadata for v${{ env.RELEASE_VERSION }}"
        commit-message: "Update release metadata for v${{ env.RELEASE_VERSION }}"
        body: |
          Updates `updates.json` after publishing ZotMeta v${{ env.RELEASE_VERSION }}.

          Merge this PR to notify existing users about the new release.
        add-paths: updates.json
